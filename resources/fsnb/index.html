<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font:14px/1.45 "Segoe UI","Noto Sans","Noto Sans Georgian",system-ui,-apple-system,Roboto,Arial,sans-serif}

#app{display:grid;grid-template-columns:350px 1fr;height:100vh}
#side{background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}

.ti .row:hover{background:var(--head)}
.ti .row.on{background:var(--accent-soft)}
.ti .caret{flex:none;width:22px;height:26px;border:0;background:none;cursor:pointer;color:var(--soft);padding:0;font-size:10px}
.ti .caret.leaf{visibility:hidden}
.ti .caret.open{transform:rotate(90deg)}

.ti a:hover{text-decoration:none}
.ti a b{font-weight:600;font-variant-numeric:tabular-nums}
.ti .n{flex:none;color:var(--soft);font-size:11px;padding:6px 6px 0 4px;font-variant-numeric:tabular-nums}

.ti.base>.row a{font-weight:700;font-size:15px}

.meta{color:var(--soft);margin:0 0 14px}
.list{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden;max-width:1100px}

.list a:first-child{border-top:0}
.list a:hover{background:var(--head);text-decoration:none}
.list .k{flex:none;min-width:92px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.list .v{flex:1;min-width:0}
.list .c{flex:none;color:var(--soft);font-size:12px;font-variant-numeric:tabular-nums}
.wrap{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:auto;max-width:100%}
.wrap.tall{max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 10px;border-top:1px solid var(--rule);text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:var(--head);border-top:0;border-bottom:1px solid var(--rule);font-weight:600;font-size:12.5px;z-index:2;white-space:nowrap}
tbody tr:first-child>*{border-top:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.codecell{white-space:nowrap;font-variant-numeric:tabular-nums}
.norms tbody tr{cursor:pointer}
.norms tbody tr:hover{background:var(--head)}
.copy{border:1px solid transparent;background:none;border-radius:4px;padding:1px 5px;margin:-2px 0 -2px -6px;cursor:copy;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

.hl,tr.hl>td{background:var(--mark)!important;color:var(--mark-ink)}

.sub{color:var(--soft);font-size:12px;margin-top:1px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.tools{display:flex;gap:6px;align-items:center;margin:26px 0 8px}
.tools h2{margin:0 auto 0 0}
.seg{border:1px solid var(--rule);background:var(--surface);padding:5px 12px;cursor:pointer;border-radius:6px}
.seg[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.seg[aria-pressed=true]{color:#0c1320}}
.matrix th.w{min-width:64px;text-align:right;cursor:pointer}
.matrix td.q{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.matrix a.rc{display:block;font-size:11.5px;font-variant-numeric:tabular-nums}

.chsum li{margin:2px 0}
.lnk{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}
.badge{border:1px solid var(--mark);background:var(--mark);color:var(--mark-ink);border-radius:10px;font-size:11px;padding:0 7px;cursor:pointer;vertical-align:1px}
.chhead{border-top:2px solid var(--rule);padding-top:18px}
.chtitle{scroll-margin-top:10px}
.matrix td.q:empty::after{content:"—";color:var(--rule)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;margin:0 0 14px;max-width:1100px;overflow:hidden}
.card.hl{background:var(--surface)!important;color:var(--ink);box-shadow:0 0 0 3px var(--mark)}
.card header{padding:12px 14px 4px}
.card h3{margin:0;font-size:15px;font-weight:600}
.card h3 b{color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}
.card .body{padding:0 14px 10px}
.card .wrap{border-width:1px 0 0;border-radius:0}
ul.comp{margin:4px 0 0;padding-left:20px;max-width:75em}
.note{color:var(--soft);font-size:12.5px;margin:10px 0 0}
.tech p.ed{margin:-4px 0 10px;font-style:italic}
.empty{background:var(--surface);border:1px dashed var(--rule);border-radius:8px;padding:22px;color:var(--soft);max-width:720px}
.more{margin-top:12px}
.load{max-width:520px;margin:12vh auto 0;text-align:center;color:var(--soft)}
.load .track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:14px 0 8px}
.load .fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.load .seg{margin-top:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:7px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.on{opacity:1}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 18% 0 0;z-index:10;transform:translateX(-102%);transition:transform .18s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #side.open{transform:none}
  #menu{display:block}
  #bar{padding:8px 10px;flex-wrap:wrap}
  #q{flex:1 1 100%;order:5}
  .norms{min-width:600px}
  #main{padding:14px 12px 50px}
  .matrix .res{min-width:200px;max-width:240px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
var FSNB = {bases: [], details: {}, tch: {}, v: '', files: null};

FSNB.detail = function (key, d) { this.details[key] = d; };

<script>
FSNB.start = function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var main = $('#main'), tree = $('#tree'), qIn = $('#q'), fb = $('#fb'), fl = $('#fl'), side = $('#side');
var bases = FSNB.bases, works = [], tables = [];
var machs = [], machIdx = {}, coefs = [], coefBy = {}, nodeIdx = {}, workIdx = {};
var seqNo = 0, searching = false, view = 'matrix';
try { view = localStorage.getItem('fsnb.view') || 'matrix'; } catch (e) {}

function h(tag, props) {
  var e = document.createElement(tag), k, v, i, c;
  if (props) for (k in props) {
    v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);

    else e.append(c);
  }
  return e;
}
function norm(s) { return s.toLowerCase().replace(/ё/g, 'е'); }
function fullName(node, w) { return ((node.g && node.g[w[1]] || '') + ' ' + w[2]).trim(); }
function isTable(node) { return !!node.w; }
function label(node) {
  if (node.isBase) return node.title;
  if (isTable(node) || node.t === 'Сборник' || node.b.kind) return node.n;
  return (node.t + ' ' + node.c).trim() + (node.n ? '. ' + node.n : '');
}
function key(node) {
  if (node.isBase) return '';
  if (isTable(node)) return node.c;
  if (node.t === 'Сборник' || node.b.kind) return node.c;
  return '';
}
function num(x) { return x == null ? '' : String(Math.round(x * 1e4) / 1e4); }
var NOUN = {mach: ' მანქანა', coef: ' კოეფიციენტი'};
function plural(n, kind) { return n.toLocaleString('ru-RU') + (NOUN[kind] || ' ნორმა'); }

// ---------- подготовка индекса ----------
function prep(node, parent, base, path, sb) {
  node.p = parent; node.b = base; node.path = path; node.sb = sb; node.cnt = 0;
  if (node.w) {
    node.cnt = node.w.length;
    tables.push(node);
    node.w.forEach(function (w) {
      var name = fullName(node, w);
      works.push({n: node, w: w, name: name, hay: norm(w[0] + ' ' + name)});
      workIdx[base.title + '|' + w[0]] = node;
    });
  }
  if (!base.kind && (node.w || node.t === 'Сборник')) nodeIdx[base.title + '|' + node.c] = node;
  if (node.m) {
    node.cnt = node.m.length;
    node.m.forEach(function (r) {
      machIdx[r[0]] = {n: node, r: r};
      machs.push({n: node, r: r, hay: norm(r[0] + ' ' + r[1])});
    });
  }
  if (node.k) {
    node.cnt = node.k.length;
    node.k.forEach(function (k) { k.node = node; k.i = coefs.length; k.hay = norm(k.c + ' ' + k.n); coefs.push(k); });
  }
  if (node.ch) node.ch.forEach(function (c, i) {
    prep(c, node, base, path.concat(i), sb || c);
    node.cnt += c.cnt;
  });
}
bases.forEach(function (b, i) {
  b.isBase = true; b.bi = i;
  prep(b, null, b, [i], null);
  fb.append(h('option', {value: i, text: b.title}));
});
fb.prepend(h('option', {value: '', text: 'ყველა ბაზა', selected: true}));
// привязки коэффициентов: «база|шифр таблицы/сборника» и «база|шифр нормы»
function addCoef(key, k) { (coefBy[key] || (coefBy[key] = [])).push(k); }
coefs.forEach(function (k) {
  (k.s || []).forEach(function (code) { addCoef((k.b || '*') + '|' + code, k); });
  (k.k || []).forEach(function (raw) {
    var i = raw.indexOf(' ');
    addCoef(i > 0 ? raw.slice(0, i) + '|' + raw.slice(i + 1) : (k.b || '*') + '|' + raw, k);
  });
});
$('#stat').textContent = works.length ? works.length.toLocaleString('ru-RU') + ' ნორმა' : '';

function hashFor(node, w) { return '#p=' + node.path.join('.') + (w ? '&w=' + encodeURIComponent(w) : ''); }
function nodeAt(path) {
  var n = bases[path[0]], i;
  for (i = 1; n && i < path.length; i++) n = n.ch && n.ch[path[i]];
  return n || null;
}
function go(node, w) {
  var hh = hashFor(node, w);
  if (location.hash === hh) route(); else location.hash = hh;
}

// ---------- оглавление ----------
function treeItem(node) {
  var has = !!(node.ch && node.ch.length);
  var caret = h('button', {class: 'caret' + (has ? '' : ' leaf'), type: 'button', 'aria-label': 'გაშლა', text: '▶',
    onclick: function () { toggle(node); }});
  var k = key(node);
  var a = h('a', {href: hashFor(node), title: label(node)}, k ? h('b', {text: k + ' '}) : null, label(node));
  var row = h('div', {class: 'row'}, caret, a, h('span', {class: 'n', text: node.cnt.toLocaleString('ru-RU')}));
  var kids = h('div', {class: 'kids', hidden: true});
  node._row = row; node._caret = caret; node._kids = kids; node._open = false; node._built = false;
  return h('div', {class: 'ti' + (node.isBase ? ' base' : '')}, row, kids);
}
function expand(node) {
  if (!node.ch || !node.ch.length || !node._kids) return;
  if (!node._built) { node.ch.forEach(function (c) { node._kids.append(treeItem(c)); }); node._built = true; }
  node._kids.hidden = false; node._open = true; node._caret.classList.add('open');
}
function toggle(node) {
  if (node._open) { node._kids.hidden = true; node._open = false; node._caret.classList.remove('open'); }
  else expand(node);
}
var activeRow = null;
function syncTree(node) {
  var chain = [], n;
  for (n = node; n; n = n.p) chain.unshift(n);
  chain.forEach(function (x, i) { if (i < chain.length - 1 || x.isBase) expand(x); });
  if (activeRow) activeRow.classList.remove('on');

  if (activeRow) { activeRow.classList.add('on'); activeRow.scrollIntoView({block: 'nearest'}); }
}
bases.forEach(function (b) { tree.append(treeItem(b)); });
if (bases.length === 1) expand(bases[0]);

// ---------- детали сборника ----------
var waiting = {};
function loadDetail(sb) {
  var k = sb.f;
  if (FSNB.details[k]) return Promise.resolve(FSNB.details[k]);

    s.onload = function () { FSNB.details[k] ? res(FSNB.details[k]) : rej(new Error('empty')); };
    s.onerror = function () { delete waiting[k]; rej(new Error('load')); };

}

// ---------- общие куски ----------
function crumbs(node) {
  var box = h('div', {class: 'crumbs'}), chain = [], n;
  if (qIn.value.trim() || fl.value) box.append(h('button', {class: 'back', type: 'button', text: '← ძებნის შედეგები', onclick: doSearch}));
  for (n = node.p; n; n = n.p) chain.unshift(n);
  box.append(h('a', {href: '#', text: 'ФСНБ-2022'}));
  chain.forEach(function (x) {
    box.append(h('span', {class: 'sep', text: '›'}), h('a', {href: hashFor(x), text: (key(x) ? key(x) + ' ' : '') + label(x)}));

}
function toast(msg) {

function copy(text) {
  function done() { toast('დაკოპირდა: ' + text); }

    var ta = h('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';

    onclick: function (e) { e.stopPropagation(); copy(code); }});
}

  return h('div', {class: 'list'}, node.ch.map(function (c) {

}

// ---------- главная ----------
function renderHome() {

    if (d.ed && d.src) box.append(h('p', {class: 'meta'}, h('a', {href: d.src, target: '_blank', rel: 'noopener', text: 'Открыть на meganorm.ru'})));
    if (chs.length) {
      box.append(h('div', {class: 'chsum'}, h('b', {text: (d.ed ? 'Изменения после этой редакции (' : 'Изменения (') + chs.length + '):'}),
        h('ul', null, chs.map(function (c, ci) {
          var only = !c.items.some(function (it) { return it[0] !== 's'; });
          return h('li', null, h('button', {class: 'lnk', type: 'button', text: chLabel(c),
            onclick: function () { var t = document.getElementById('ch-' + ci); if (t) t.scrollIntoView({block: 'start'}); }}),
            only ? ' — изменены только таблицы норм' : ' — изменения в технической части');
        }))));
    } else {
      box.append(h('p', {class: 'meta', text: d.ed ? 'Более поздних приказов с изменениями этого сборника в папке «техчасть» нет.'
        : 'Изменений к технической части в папке «техчасть» не найдено.'}));
    }
    var heads = d.items.filter(function (it) { return it[0] === 'h'; });
    if (heads.length > 2) {
      box.append(h('div', {class: 'chsum'}, h('b', {text: 'Содержание:'}), h('ul', {class: 'toc'}, heads.map(function (it) {
        return h('li', null, h('button', {class: 'lnk', type: 'button', text: it[1], onclick: function () {
          var all = box.querySelectorAll('h2,h3');
          for (var i = 0; i < all.length; i++) if (all[i].firstChild && all[i].firstChild.textContent === it[1]) { all[i].scrollIntoView({block: 'start'}); break; }
        }}));
      }))));
    }
    techItems(d.items, refs, chs).forEach(function (e) { if (e) box.append(e); });
    if (chs.length) {
      box.append(h('h2', {class: 'chhead', text: 'Изменения'}));
      chs.forEach(function (c, ci) {
        var only = !c.items.some(function (it) { return it[0] !== 's'; });
        box.append(h('h3', {id: 'ch-' + ci, class: 'chtitle', text: chLabel(c)}),
          h('p', {class: 'note', text: 'Файл: ' + c.file}));
        if (only) box.append(h('p', {text: 'В этом приказе для сборника изменены только таблицы норм (раздел III) — они уже учтены в XML.'}));
        else techItems(c.items, null, chs).forEach(function (e) { if (e) box.append(e); });
      });
    }
  }, function () {
    if (seq !== seqNo) return;
    box.replaceChildren(h('div', {class: 'empty', text: 'Не удалось открыть data/' + key + '.js.'}));
  });
}

// ---------- поиск ----------
function hilite(text, tokens) {
  var low = norm(text), spans = [], out = [], pos = 0;
  tokens.forEach(function (t) {
    var i = low.indexOf(t);
    while (i >= 0) { spans.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
  });
  if (!spans.length || low.length !== text.length) return [text];
  spans.sort(function (a, b) { return a[0] - b[0]; });
  spans.forEach(function (s) {
    if (s[1] <= pos) return;
    var a = Math.max(s[0], pos);
    if (a > pos) out.push(text.slice(pos, a));
    out.push(h('mark', {text: text.slice(a, s[1])}));
    pos = s[1];
  });
  if (pos < text.length) out.push(text.slice(pos));
  return out;
}
var sortLabor = false;
function doSearch() {
  var tokens = norm(qIn.value).split(/\s+/).filter(Boolean);
  var bsel = fb.value === '' ? null : bases[+fb.value];
  var kind = bsel ? (bsel.kind || 'norm') : '';
  var maxL = fl.value === '' ? null : parseFloat(fl.value);
  if (isNaN(maxL)) maxL = null;
  if (!tokens.length && maxL == null) { searching = false; route(); return; }
  searching = true; ++seqNo;
  function ok(hay) { for (var i = 0; i < tokens.length; i++) if (hay.indexOf(tokens[i]) < 0) return false; return true; }

  var first = [], rest = [];
  works.forEach(function (x) {
    if (kind && x.n.b !== bsel) return;
    if (maxL != null && (x.w[4] == null || x.w[4] > maxL)) return;
    if (!ok(x.hay)) return;
    (tokens.length && x.hay.indexOf(tokens[0]) === 0 ? first : rest).push(x);
  });
  var found = first.concat(rest);
  if (sortLabor) found.sort(function (a, b) {
    return (a.w[4] == null ? Infinity : a.w[4]) - (b.w[4] == null ? Infinity : b.w[4]);
  });
  var tabs = [];
  var mfound = [], cfound = [];
  if (tokens.length && maxL == null) {
    if (!kind || kind === 'mach') machs.forEach(function (x) { if (ok(x.hay)) mfound.push(x); });
    if (!kind || kind === 'coef') coefs.forEach(function (k) { if (ok(k.hay)) cfound.push(k); });
  }
  if (tokens.length && maxL == null) tables.some(function (t) {
    if (kind && t.b !== bsel) return false;
    if (ok(norm(t.c + ' ' + t.n))) tabs.push(t);
    return tabs.length >= 40;
  });

  main.replaceChildren(h('h1', {text: 'ძებნის შედეგები'}),
    h('p', {class: 'meta', text: [found.length || !(tabs.length + mfound.length + cfound.length) ? plural(found.length) : '',
      tabs.length ? tabs.length + (tabs.length >= 40 ? '+' : '') + ' ცხრილი' : '',
      mfound.length ? plural(mfound.length, 'mach') : '',
      cfound.length ? plural(cfound.length, 'coef') : ''].filter(Boolean).join(', ') +
      (maxL != null ? ' · ЗТ рабочих ≤ ' + maxL + ' чел.-ч' : '')}));
  if (!found.length && !tabs.length && !mfound.length && !cfound.length) {
    main.append(h('div', {class: 'empty', text: 'ვერაფერი მოიძებნა. სცადე სიტყვის ნაწილი (მაგ. «бетон» ნაცვლად «бетонирование»), ნაკლები სიტყვა ან სხვა ბაზა.'}));
    return;
  }
  if (tabs.length) {
    main.append(h('h2', {text: 'Таблицы'}), h('div', {class: 'list'}, tabs.map(function (t) {
      return h('a', {href: hashFor(t)}, h('span', {class: 'k', text: t.b.title + ' ' + t.c}),
        h('span', {class: 'v'}, hilite(t.n, tokens)), h('span', {class: 'c', text: plural(t.cnt)}));
    })));
  }
  if (mfound.length) {
    main.append(h('h2', {text: 'Машины и механизмы (ФСБЦ Маш)'}), h('div', {class: 'list'}, mfound.slice(0, 60).map(function (x) {
      return h('a', {href: hashFor(x.n, x.r[0])}, h('span', {class: 'k', text: x.r[0]}),
        h('span', {class: 'v'}, hilite(x.r[1], tokens)), h('span', {class: 'c', text: x.r[2]}));
    })));
    if (mfound.length > 60) main.append(h('p', {class: 'note', text: 'ნაჩვენებია პირველი 60 — დააზუსტე ძებნა.'}));
  }
  if (cfound.length) {
    main.append(h('h2', {text: 'Поправочные коэффициенты'}), h('div', {class: 'list'}, cfound.slice(0, 60).map(function (k) {
      return h('a', {href: hashFor(k.node, k.c)}, h('span', {class: 'k', text: k.c}),
        h('span', {class: 'v'}, hilite(k.n, tokens)), h('span', {class: 'c', text: k.node.c}));
    })));
    if (cfound.length > 60) main.append(h('p', {class: 'note', text: 'ნაჩვენებია პირველი 60 — დააზუსტე ძებნა.'}));
  }
  if (!found.length) return;
  var body = h('tbody'), shown = 0;
  var sortBtn = h('button', {class: 'seg', type: 'button', 'aria-pressed': sortLabor,
    text: 'ЗТ-ის ზრდადობით', onclick: function () { sortLabor = !sortLabor; doSearch(); }});
  main.append(h('div', {class: 'tools'}, h('h2', {text: 'Нормы'}), sortBtn));
  main.append(h('div', {class: 'wrap'}, h('table', {class: 'norms'},
    h('thead', null, h('tr', null, h('th', {text: 'Шифр'}), h('th', {text: 'Наименование'}),
      h('th', {text: 'Измеритель'}), h('th', {class: 'num', text: 'ЗТ рабочих, чел.-ч'}))), body)));
  var more = h('button', {class: 'seg more', type: 'button', onclick: add});
  main.append(more);
  function add() {
    found.slice(shown, shown + 300).forEach(function (x) {
      body.append(h('tr', {onclick: function () { go(x.n, x.w[0]); }},
        h('td', {class: 'codecell'}, copyBtn(x.w[0]), h('div', {class: 'sub', text: x.n.b.title})),
        h('td', null, hilite(x.name, tokens),
          h('div', {class: 'sub', text: (x.n.sb ? 'Сб. ' + x.n.sb.c + ' · ' : '') + 'табл. ' + x.n.c + ' ' + x.n.n})),
        h('td', {text: x.w[3]}),
        h('td', {class: 'num', text: num(x.w[4])})));
    });
    shown = Math.min(found.length, shown + 300);
    more.hidden = shown >= found.length;
    more.textContent = 'კიდევ 300 (ნაჩვენებია ' + shown + ' / ' + found.length + ')';
  }
  add();
  main.scrollTop = 0;
}

// ---------- маршрут ----------
function route() {
  searching = false;
  var m = /p=([\d.]+)/.exec(location.hash), w = /[&#]w=([^&]+)/.exec(location.hash);
  var node = m ? nodeAt(m[1].split('.').map(Number)) : null;
  side.classList.remove('open');
  if (!node) { ++seqNo; renderHome(); main.scrollTop = 0; return; }
  if (/[&#]t=1/.test(location.hash)) {
    var sbn = node.t === 'Сборник' ? node : (node.sb || node);
    renderTech(sbn);
    syncTree(sbn);
    main.scrollTop = 0;
    return;
  }
  renderNode(node, w ? decodeURIComponent(w[1]) : null);
  syncTree(node);
  main.scrollTop = 0;
}
var timer = null;
function later() { clearTimeout(timer); timer = setTimeout(doSearch, 160); }
qIn.addEventListener('input', later);
fl.addEventListener('input', later);
fb.addEventListener('change', function () { if (qIn.value.trim() || fl.value) doSearch(); });
qIn.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { clearTimeout(timer); doSearch(); }
  if (e.key === 'Escape') { qIn.value = ''; doSearch(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); qIn.focus(); qIn.select(); }
});
$('#menu').addEventListener('click', function () { side.classList.toggle('open'); });
window.addEventListener('hashchange', route);
route();
};

// ---------- запуск: офлайн — сразу; на сайте — после загрузки оглавлений ----------
(function () {
  if (!FSNB.files) { FSNB.start(); return; }
  var main = document.getElementById('main'), q = document.getElementById('q');
  var total = 0, done = 0, left = FSNB.files.length, failed = false;
  FSNB.files.forEach(function (f) { total += f[1]; });
  var fill = document.createElement('div'), track = document.createElement('div');
  var text = document.createElement('div'), pct = document.createElement('div'), box = document.createElement('div');
  fill.className = 'fill'; track.className = 'track'; box.className = 'load';
  text.textContent = 'იტვირთება ნორმების ბაზა…';
  track.append(fill); box.append(text, track, pct); main.append(box);
  q.disabled = true;
  function show() {
    var p = total ? Math.round(done / total * 100) : 0;
    fill.style.width = p + '%'; pct.textContent = p + '%';
  }
  function fail() {
    if (failed) return;
    failed = true;
    var b = document.createElement('button');
    b.className = 'seg'; b.type = 'button'; b.textContent = 'თავიდან ცდა';
    b.onclick = function () { location.reload(); };
    text.textContent = 'ბაზა ბოლომდე ვერ ჩაიტვირთა. შეამოწმე ინტერნეტი და სცადე თავიდან.';
    track.remove(); pct.remove(); box.append(b);
  }
  show();
  FSNB.files.forEach(function (f) {
    var s = document.createElement('script');
    s.async = false;                       // качаются параллельно, выполняются по порядку
    s.src = 'data/' + f[0] + FSNB.v;
    s.onload = function () {
      done += f[1]; left--; show();
      if (!left && !failed) { q.disabled = false; FSNB.start(); }
    };
    s.onerror = fail;
    document.head.append(s);
  });
})();
</script>
